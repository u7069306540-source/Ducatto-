<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUCATTO Premium</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:#fff;
  padding-bottom:80px;
}
header{
  padding:18px;
  background:#151522;
  border-bottom:1px solid #29293a;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{font-size:28px;font-weight:800}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 12px;
  border-radius:20px;
  background:#e5b84b;
  color:#111;
  font-size:12px;
  font-weight:bold;
}
main{max-width:900px;margin:auto;padding:20px}
.view{display:none}
.view.active{display:block}
.hero{
  background:linear-gradient(135deg,#302043,#171725);
  padding:24px;
  border-radius:20px;
  margin-bottom:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:#171722;
  border:1px solid #29293a;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
}
.tile{cursor:pointer;min-height:125px}
.icon{font-size:32px;margin-bottom:8px}
.card p{color:#aaa;line-height:1.5}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}
.primary{background:#e5b84b;color:#111}
.secondary{background:#29293a;color:#fff}
input{
  width:100%;
  padding:13px;
  margin:7px 0 10px;
  border-radius:10px;
  border:1px solid #333344;
  background:#11111a;
  color:#fff;
}
a{color:#e5b84b}
.result{
  display:flex;
  gap:14px;
  align-items:flex-start;
}
.cover{
  width:70px;
  height:95px;
  object-fit:cover;
  border-radius:8px;
  background:#29293a;
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#151522;
  border-top:1px solid #29293a;
  display:flex;
  justify-content:space-around;
  padding:8px;
  z-index:20;
}
nav button{
  background:none;
  color:#aaa;
  padding:5px;
}
nav span{display:block;font-size:20px}
.notice{
  padding:13px;
  background:#20202d;
  border-radius:12px;
  margin-bottom:15px;
  color:#ccc;
}
.back{margin-bottom:18px}

@media(max-width:600px){
.grid{grid-template-columns:1fr}
main{padding:14px}
}
</head>
<body>
<header>
  <div class="logo">DUCATTO</div>
  <div class="badge">👑 JEFA · PREMIUM ACTIVO</div>
</header>
<main>
<section id="inicio" class="view active">
  <div class="hero">
    <h1>Bienvenida a DUCATTO</h1>
    <p>Entretenimiento, libros, lugares y organización en un solo sitio.</p>
  </div>
  <div class="grid">
<div class="card tile" onclick="abrir('peliculas')">
  <div class="icon">🎬</div>
  <h3>Películas</h3>
  <p>Catálogo e información</p>
</div>
<div class="card tile" onclick="abrir('series')">
  <div class="icon">📺</div>
  <h3>Series</h3>
  <p>Catálogo e información</p>
</div>
<div class="card tile" onclick="abrir('libros')">
  <div class="icon">📚</div>
  <h3>Libros</h3>
  <p>Busca libros y opciones de lectura</p>
</div>
<div class="card tile" onclick="abrir('lugares')">
  <div class="icon">📍</div>
  <h3>Lugares</h3>
  <p>Busca lugares en el mapa</p>
</div>
<div class="card tile" onclick="abrir('agenda')">
  <div class="icon">📅</div>
  <h3>Agenda</h3>
  <p>Organiza tus eventos</p>
</div>
<div class="card tile" onclick="abrir('perfil')">
  <div class="icon">👤</div>
  <h3>Perfil</h3>
  <p>Cuenta y Premium</p>
</div>
  </div>
</section>
<section id="peliculas" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>🎬 Películas</h2>
  <div class="notice">
    Aquí puedes preparar un catálogo de películas disponibles legalmente.
  </div>
  <div class="card">
    <h3>🎞️ Catálogo DUCATTO</h3>
    <p>
      Las fichas pueden incluir título, descripción, imagen y dónde
      encontrar la película legalmente.
    </p>
  </div>
  <div class="card">
    <h3>Próximo catálogo</h3>
    <p>Esta zona queda preparada para añadir películas autorizadas.</p>
  </div>
</section>
<section id="series" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>📺 Series</h2>
  <div class="notice">
    Aquí aparecerán series y sus opciones legales de visualización.
  </div>
  <div class="card">
    <h3>📺 Catálogo DUCATTO</h3>
    <p>
      Podemos añadir fichas con título, descripción y dónde ver cada serie
      legalmente.
    </p>
  </div>
</section>
<section id="libros" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>📚 Libros</h2>
  <input id="busquedaLibro" placeholder="Escribe título o autor">

Buscar libro

  <div id="resultadosLibro"></div>
</section>
<section id="lugares" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>📍 Lugares</h2>
  <div class="card">
    <p>Busca una ciudad, restaurante, museo, parque o cualquier lugar.</p>
<input id="busquedaLugar" placeholder="Ej.: Málaga, museo, parque...">
<button class="primary" onclick="buscarLugar()">
  Buscar lugar
</button>
  </div>
  <div id="resultadosLugar"></div>
</section>
<section id="agenda" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>📅 Agenda</h2>
  <div class="card">
    <input id="evento" placeholder="Nuevo evento">
<button class="primary" onclick="guardarEvento()">
  Guardar evento
</button>
  </div>
  <div id="listaAgenda"></div>
</section>
<section id="perfil" class="view">
  <button class="secondary back" onclick="inicio()">← Volver</button>
  <h2>👤 Perfil</h2>
  <div class="card">
    <h3>👑 Jefa</h3>
    <p>Premium: <strong>ACTIVO</strong></p>
    <p>Modo demostración activado.</p>
  </div>
</section>
</main>
<nav>
  <button onclick="inicio()">
    <span>🏠</span>Inicio
  </button>
  <button onclick="abrir('peliculas')">
    <span>🎬</span>Películas
  </button>
  <button onclick="abrir('series')">
    <span>📺</span>Series
  </button>
  <button onclick="abrir('libros')">
    <span>📚</span>Libros
  </button>
  <button onclick="abrir('perfil')">
    <span>👤</span>Perfil
  </button>
</nav>
<script>
function abrir(id){
  document.querySelectorAll(".view").forEach(function(v){
    v.classList.remove("active");
  });
  const pagina=document.getElementById(id);
  if(pagina){
    pagina.classList.add("active");
    window.scrollTo(0,0);
  }
}
function inicio(){
  abrir("inicio");
}
/* LIBROS */
async function buscarLibro(){
  const texto=document
    .getElementById("busquedaLibro")
    .value
    .trim();
  const resultados=document
    .getElementById("resultadosLibro");
  if(!texto){
    resultados.innerHTML=
      '<div class="card">Escribe un título o autor.</div>';
    return;
  }
  resultados.innerHTML=
    '<div class="card">🔎 Buscando libros...</div>';
  try{
    const respuesta=await fetch(
      "https://openlibrary.org/search.json?q="+
      encodeURIComponent(texto)+
      "&limit=8"
    );
    const datos=await respuesta.json();
    resultados.innerHTML="";
    if(!datos.docs || datos.docs.length===0){
      resultados.innerHTML=
        '<div class="card">No encontramos resultados.</div>';
      return;
    }
    datos.docs.forEach(function(libro){
      const titulo=libro.title || "Sin título";
      const autor=libro.author_name
        ? libro.author_name.join(", ")
        : "Autor desconocido";
      const key=libro.key || "";
      const enlace=key
        ? "https://openlibrary.org"+key
        : "#";
      const portada=libro.cover_i
        ? "https://covers.openlibrary.org/b/id/"+
          libro.cover_i+"-M.jpg"
        : "";
      resultados.innerHTML += `
        <div class="card">
          <div class="result">
            ${
              portada
              ? `<img class="cover" src="${portada}" alt="">`
              : `<div class="cover"></div>`
            }
            <div>
              <h3>${escapar(titulo)}</h3>
              <p>${escapar(autor)}</p>
              <a href="${enlace}"
                 target="_blank"
                 rel="noopener">
                 Consultar libro →
              </a>
            </div>
          </div>
        </div>
      `;
    });
  }catch(error){
    resultados.innerHTML=
      '<div class="card">No se pudo conectar con la biblioteca.</div>';
  }
}
/* LUGARES */
async function buscarLugar(){
  const texto=document
    .getElementById("busquedaLugar")
    .value
    .trim();
  const resultados=document
    .getElementById("resultadosLugar");
  if(!texto){
    resultados.innerHTML=
      '<div class="card">Escribe un lugar.</div>';
    return;
  }
  resultados.innerHTML=
    '<div class="card">📍 Buscando...</div>';
  try{
    const respuesta=await fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q="+
      encodeURIComponent(texto),
      {
        headers:{
          "Accept":"application/json"
        }
      }
    );
    const datos=await respuesta.json();
    resultados.innerHTML="";
    if(datos.length===0){
      resultados.innerHTML=
        '<div class="card">No encontramos ese lugar.</div>';
      return;
    }
    datos.forEach(function(lugar){
      const nombre=lugar.display_name || "Lugar";
      const lat=lugar.lat;
      const lon=lugar.lon;
      const mapa=
        "https://www.openstreetmap.org/?mlat="+
        encodeURIComponent(lat)+
        "&mlon="+
        encodeURIComponent(lon)+
        "#map=16/"+lat+"/"+lon;
      resultados.innerHTML += `
        <div class="card">
          <h3>📍 ${escapar(nombre)}</h3>
          <a href="${mapa}"
             target="_blank"
             rel="noopener">
             Abrir en el mapa →
          </a>
        </div>
      `;
    });
  }catch(error){
    resultados.innerHTML=
      '<div class="card">No se pudo buscar el lugar.</div>';
  }
}
/* AGENDA */
let agenda=
  JSON.parse(
    localStorage.getItem("ducattoAgenda") || "[]"
  );
function guardarEvento(){
  const input=document.getElementById("evento");
  const texto=input.value.trim();
  if(!texto) return;
  agenda.push(texto);
  localStorage.setItem(
    "ducattoAgenda",
    JSON.stringify(agenda)
  );
  input.value="";
  mostrarAgenda();
}
function mostrarAgenda(){
  const lista=document.getElementById("listaAgenda");
  lista.innerHTML="";
  agenda.forEach(function(evento,index){
    lista.innerHTML += `
      <div class="card">
        📅 ${escapar(evento)}
        <br><br>
        <button class="secondary"
          onclick="borrarEvento(${index})">
          Borrar
        </button>
      </div>
    `;
  });
}
function borrarEvento(index){
  agenda.splice(index,1);
  localStorage.setItem(
    "ducattoAgenda",
    JSON.stringify(agenda)
  );
  mostrarAgenda();
}
/* SEGURIDAD DE TEXTO */
function escapar(texto){
  return String(texto)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
mostrarAgenda();
</script>
</body>
</html>
